services:
  go-app:
    container_name: go-tender-app
    image: arthurkolobov/go-tender-app:1.0.0
    build:
      context: .
    environment:
      DATABASE_URL: "host=go_db_tender user=postgres password=postgres dbname=postgres sslmode=disable"
      SECRET_KEY: "TypoOchenSlogniiKey"
      TZ: "Europe/Moscow"
    volumes:
      - documents:/app/documents
    ports:
      - "80:80"
      - "8080:8080" 
    depends_on:
      - go_db
    restart: always 
    networks:
      - app-network 

  go_db:
    container_name: go_db_tender
    image: postgres:16-cron
    build:
      context: ./db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: "Europe/Moscow"  
      PGTZ: "Europe/Moscow"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - app-network 
    

networks: 
  app-network:
    driver: bridge

volumes:
  postgres_data:
  documents: